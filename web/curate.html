<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>選別 — 川下りアーカイブ(開発用)</title>
  </head>
  <body>
    <header id="bar">
      <h1>素材の選別 <small>動画と、GPS の無い写真(位置を推定したもの)だけを表示。クリックで除外 / 復帰</small></h1>
      <div id="tools">
        <label><input type="checkbox" id="only-video" checked /> 動画だけ</label>
        <label><input type="checkbox" id="show-excluded" checked /> 除外済みも表示</label>
        <label><input type="checkbox" id="sound" /> 音あり(ホバー再生)</label>
        <span id="stat"></span>
        <button id="btn-cands" type="button">自動候補をまとめて除外</button>
        <button id="btn-save" type="button">今すぐ保存</button>
        <small>(クリックのたびに data/exclude.json へ自動保存)</small>
        <span id="saved" aria-live="polite"></span>
      </div>
    </header>
    <main id="grid"></main>
    <script type="module" src="/src/curate.ts"></script>
  </body>
</html>
