<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>2017 川下り 山谷川から石巻へ</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" />
  </head>
  <body>
    <!-- data-view: map(地図のみ) / split(上=写真 下=地図) / photo(写真のみ) -->
    <div id="app" data-view="map">
      <!-- 上半分: 写真 -->
      <section id="photo" aria-label="写真">
        <img id="photo-img" alt="" draggable="false" />
        <video id="photo-video" playsinline preload="metadata" hidden></video>
        <div id="spin" role="status" aria-label="読み込み中"></div>
        <div id="video-ui" hidden>
          <button id="btn-play" type="button" aria-label="再生"></button>
          <div id="video-ctl">
            <button id="btn-pp" type="button" aria-label="再生 / 一時停止"></button>
            <span id="video-time">0:00 / 0:00</span>
            <div id="video-bar" role="slider" aria-label="再生位置" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0"><div id="video-progress"></div><div id="video-knob"></div></div>
            <button id="btn-mute" type="button" aria-label="音を消す" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk-body" d="M4 9v6h4l5 4V5L8 9H4z"/><path class="spk-wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="spk-off" d="M16 9l5 6M21 9l-5 6"/></svg></button>
          </div>
        </div>
        <div id="photo-camera" aria-label="カメラ"></div>
        <button id="btn-fav" type="button" aria-pressed="false" aria-label="お気に入りに登録"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.2-4.6-9.6-9.1C.7 8.6 2.3 4.5 6.1 4.1c2.2-.2 3.9 1 4.9 2.4 1-1.4 2.7-2.6 4.9-2.4 3.8.4 5.4 4.5 3.7 7.8C19.2 16.4 12 21 12 21z"/></svg></button>
        <button id="btn-close" type="button" aria-label="閉じる">×</button>
        <div id="photo-caption">
          <div id="photo-time">—</div>
          <div id="photo-sub">軌跡の上をなぞるか、タップしてください</div>
        </div>
        <nav id="photo-nav" aria-label="前後の写真">
          <button id="btn-prev" type="button" aria-label="前の写真">‹</button>
          <button id="btn-next" type="button" aria-label="次の写真">›</button>
        </nav>
      </section>
      <!-- 軌跡にマウスを乗せたときのサムネイル(PC のみ) -->
      <div id="hover" hidden aria-hidden="true">
        <img id="hover-img" alt="" />
        <div id="hover-time"></div>
      </div>
      <!-- 間: タイムラインのスライダー。左端が旅の始まり、右端が終わり。日ごとの区間と目盛り -->
      <div id="scrub" role="slider" aria-label="時刻順に写真を選ぶ" aria-valuemin="1" aria-valuemax="1" aria-valuenow="1" tabindex="0">
        <div id="scrub-days"></div>
        <div id="scrub-thumb"></div>
      </div>
      <!-- 下半分: 地図 -->
      <section id="mapwrap" aria-label="地図">
        <div id="map" role="application"></div>
        <h1 id="title">2017 川下り<span>山谷川の源流から石巻の海まで</span></h1>
        <div id="filters">
          <label class="sel"><span>日付</span><select id="sel-day" aria-label="日付で絞り込み"></select></label>
          <label class="sel"><span>種類</span><select id="sel-kind" aria-label="種類で絞り込み">
            <option value="all">すべて</option>
            <option value="photo">写真</option>
            <option value="video">動画</option>
            <option value="fav">お気に入り</option>
          </select></label>
        </div>
        <div id="toolbar">
          <button id="btn-layer" type="button" aria-pressed="false">航空写真</button>
          <button id="btn-fit" type="button">全体</button>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
